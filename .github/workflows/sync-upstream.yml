# Keeps this fork's main in step with lemomo-ai/lemo-opuscar, once a week.
# If upstream changed a workflow file, GITHUB_TOKEN cannot write it and this job fails:
# press "Sync fork" on the fork's page, or merge upstream/main from a clone and push.
name: Sync from upstream

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'tungpm21/lemo-opuscar'
    runs-on: ubuntu-latest
    steps:
      - name: Merge lemomo-ai/lemo-opuscar main into this fork
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/merge-upstream" -f branch=main
